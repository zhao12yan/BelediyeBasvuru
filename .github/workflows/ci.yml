name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: Derle ve test et
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .NET 10 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # LocalDB yalnız Windows'ta çalıştığı için CI'da SQL Server 2022 konteyneri kullanılır.
      # Parola her çalıştırmada rastgele üretilir; depoda parola yoktur.
      - name: SQL Server 2022 konteynerini başlat
        run: |
          SA_PAROLA="Ci$(openssl rand -hex 12)Aa1!"
          echo "::add-mask::$SA_PAROLA"
          docker run -d --name sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PAROLA" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PAROLA" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server hazır."; break
            fi
            echo "SQL Server bekleniyor ($i/30)..."; sleep 3
          done
          echo "ConnectionStrings__Default=Server=localhost,1433;Database=BelediyeBasvuru_CI;User Id=sa;Password=$SA_PAROLA;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Bağımlılıkları geri yükle
        run: dotnet restore BelediyeBasvuru.sln

      - name: Derle
        run: dotnet build BelediyeBasvuru.sln --no-restore -c Release

      - name: Testleri çalıştır
        run: dotnet test BelediyeBasvuru.sln --no-build -c Release --verbosity normal
